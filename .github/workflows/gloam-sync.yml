# Scheduled gloam sync — opens a PR when the vendored gloam.css/gloam.js
# drift from upstream (github.com/richardwooding/gloam@main).
#
# Copy this into a consumer's .github/workflows/ and set GLOAM_DIR to the
# directory that holds gloam.css/gloam.js (e.g. "site" or "docs").
#
# Prerequisite (one-time, per consumer repo): add a GLOAM_SYNC_TOKEN secret
# holding a PAT (fine-grained: Contents read/write + Pull requests read/write)
# or a GitHub App installation token.
#   gh secret set GLOAM_SYNC_TOKEN --repo {owner}/{repo} --body "$PAT"
#
# Why a PAT rather than the built-in GITHUB_TOKEN: GitHub deliberately does not
# trigger workflows from pushes or PRs made with GITHUB_TOKEN, to prevent
# recursive runs. With GITHUB_TOKEN the sync PR opens but *no CI ever runs on
# it* — it sits at zero checks and a "pending" combined status forever, so the
# design assets it ships are never verified. A PAT is a distinct actor, so the
# push and the PR fire the normal checks.
#
# The PAT is deliberately NOT passed to actions/checkout. Checkout uses the
# built-in token, which always works, so a missing, expired or malformed PAT
# can only fail the push at the end — never the checkout, and never the sync
# itself. (An earlier revision did pass it to checkout; one bad secret value
# then broke the whole job at step one, before anything useful ran.)
# Without the secret the job still runs and pushes with the built-in token,
# exactly as it did before the secret existed.
name: gloam-sync

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GLOAM_DIR: docs   # folder holding gloam.css/gloam.js

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync gloam assets
        run: sh "$GLOAM_DIR/sync-gloam.sh" "$GLOAM_DIR"

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GLOAM_SYNC_TOKEN || github.token }}
          SYNC_TOKEN: ${{ secrets.GLOAM_SYNC_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "gloam already up to date."
            exit 0
          fi
          BRANCH="chore/gloam-sync"
          COMMIT="$(sed -n 's/^commit=//p' "$GLOAM_DIR/.gloam-version")"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "chore(site): sync gloam assets to ${COMMIT}"
          # Push as the PAT so the branch and PR trigger CI. The token is only
          # ever used here; GitHub masks it in logs and it is not written to
          # .git/config. Falls back to the checkout credential when unset.
          if [ -n "$SYNC_TOKEN" ]; then
            git push -f "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
              "HEAD:refs/heads/${BRANCH}"
          else
            echo "::notice::GLOAM_SYNC_TOKEN is not set; pushing with the built-in token, so no CI will run on the PR."
            git push -f origin "HEAD:refs/heads/${BRANCH}"
          fi
          STATE="$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)"
          if [ "$STATE" = "OPEN" ]; then
            echo "PR already open; updated the branch."
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
              --title "chore(site): sync gloam design assets" \
              --body "Automated sync of \`gloam.css\`/\`gloam.js\` from [richardwooding/gloam](https://github.com/richardwooding/gloam)@\`${COMMIT}\`. See \`$GLOAM_DIR/.gloam-version\`."
          fi
